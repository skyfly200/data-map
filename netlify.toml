# Netlify build + functions config for the Nuxt frontend.
# Nuxt 3 (Nitro) auto-selects the Netlify preset when building on Netlify and
# emits static assets + its SSR route into `dist`. The Python data pipeline does
# NOT run here — it runs offline (locally or in the GitHub Action) and commits
# public/data/observations.geojson, which this build serves.
#
# Two custom functions add a live refresh layer:
#   refresh-observations  – scheduled; fetches new iNaturalist sightings, merges
#                           onto the committed baseline, writes to Netlify Blobs.
#   observations          – serving; returns the blob copy, else the baseline.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".env,.env.*,**/.env,**/.env.*,**/*.example,**/*.example.*"
  SECRETS_SCAN_OMIT_KEYS = "CONTACT_EMAIL_HERE,ENV_FILE,INAT_TAXON_NAME,INAT_QUALITY_GRADE,INAT_LAT,INAT_LNG,INAT_LOCATION,INAT_PER_PAGE,INAT_RADIUS,QUALITY_GRADE,PER_PAGE,RADIUS,REFRESH_ALL,SKIP_EARTH_ENGINE,SPECIES,OUTPUT_PREFIX,OUTPUT_DIR,NUXT_PUBLIC_SUPABASE_URL,NUXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,OPENTOPOGRAPHY_API_KEY,CDSAPI_KEY,EARTHENGINE_PROJECT"

[functions]
  node_bundler = "esbuild"
  # Bundle the baseline GeoJSON (and terrain rasters, if committed) so the
  # functions can read them at runtime.
  included_files = [
    "public/data/observations.geojson",
    "data/terrain/*.tif",
  ]
