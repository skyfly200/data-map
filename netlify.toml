# Netlify build + functions config for the Nuxt frontend.
# Nuxt 3 (Nitro) auto-selects the Netlify preset when building on Netlify and
# emits static assets + its SSR route into `dist`.
#
# Observations are stored in Supabase Storage (observations.geojson in the
# datasets bucket). The static GeoJSON files have been removed from the repo.
# Set NUXT_PUBLIC_DATASETS_MANIFEST_URL to the Supabase public URL printed by
# scripts/upload_datasets.mjs so the client and functions read from Supabase.
#
# Two custom functions manage the live dataset:
#   refresh-observations  – scheduled; fetches new iNaturalist sightings and
#                           merges them into Supabase Storage every 6 hours.
#   observations          – serving; reads observations.geojson from Supabase.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_ENABLED = "true"
  SECRETS_SCAN_OMIT_PATHS = ".env,.env.*,**/.env,**/.env.*,**/*.example,**/*.example.*,docs/**,supabase_migrations/**"
  SECRETS_SCAN_OMIT_KEYS = "CONTACT_EMAIL_HERE,ENV_FILE,INAT_TAXON_NAME,INAT_QUALITY_GRADE,INAT_LAT,INAT_LNG,INAT_LOCATION,INAT_PER_PAGE,INAT_RADIUS,QUALITY_GRADE,PER_PAGE,RADIUS,REFRESH_ALL,SKIP_EARTH_ENGINE,SPECIES,OUTPUT_PREFIX,OUTPUT_DIR,NUXT_PUBLIC_SUPABASE_URL,NUXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,OPENTOPOGRAPHY_API_KEY,CDSAPI_KEY,EARTHENGINE_PROJECT,EARTHENGINE_SERVICE_ACCOUNT_KEY,MEMBERSHIP_API_KEY,EE_REQUEST_DEADLINE_MS,AUTH_DISABLED,AUTH_REQUIRED,SUPABASE_DATASETS_BUCKET,NUXT_PUBLIC_DATASETS_BUCKET"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@google/earthengine"]

